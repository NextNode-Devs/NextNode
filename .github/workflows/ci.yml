name: CI

# Early feedback on feature branches and develop. staging is the testing
# branch: staging.yml calls this workflow and reports "Staging gate". main is
# production and is not re-tested; a PR into main must carry the passing
# Staging gate already recorded on the staging commit it promotes.
on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholders, not credentials: the throwaway CI database and a per-run key.
  # No Stripe credentials. Clerk development keys reach only the e2e step,
  # from repository secrets.
  DATABASE_URL: postgres://nextnode:nextnode@localhost:5432/nextnode
  REDIS_URL: redis://localhost:6379/0
  DJANGO_SECRET_KEY: ci-only-not-secret-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
  DJANGO_ENV: test
  FRONTEND_ORIGIN: http://localhost:3100

jobs:
  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: nextnode
          POSTGRES_USER: nextnode
          POSTGRES_PASSWORD: nextnode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nextnode -d nextnode"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run lint-imports
      - run: uv run python scripts/check_max_lines.py
      - run: uv run python manage.py check --fail-level WARNING
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py migrate
      - run: uv run pytest
      - name: Dependency audit
        run: |
          uv export --format requirements-txt --no-dev -q > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip
      # A green test run does not prove the app can start with production
      # settings. Placeholder values only; nothing here can sign anybody in.
      - name: Production settings pass Django's deploy checks
        env:
          DJANGO_ENV: production
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: api.example.invalid
          FRONTEND_ORIGIN: https://app.example.invalid
          CLERK_ISSUER: https://placeholder.clerk.accounts.dev
          DJANGO_SECRET_KEY: ci-deploy-check-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGH
        run: uv run python manage.py check --deploy --fail-level ERROR

  e2e:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_DB: nextnode
          POSTGRES_USER: nextnode
          POSTGRES_PASSWORD: nextnode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nextnode -d nextnode"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked && uv run python manage.py migrate
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install Playwright system dependencies
        timeout-minutes: 5
        working-directory: frontend
        run: npx playwright install-deps chromium
      - name: Install Chromium (retried; a stalled download must not hang the job)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            timeout 240 npx playwright install chromium && exit 0
            echo "Attempt $attempt failed; retrying."; sleep 5
          done
          exit 1
      - name: End-to-end tests (real build, real API, real database)
        working-directory: frontend
        env:
          CI: "true"
          # Clerk development instance (never production), so the signed-in
          # journeys (#1) run instead of skipping. Playwright passes these on to
          # the Django and Next.js servers it starts. Empty when secrets are
          # unavailable (e.g. fork PRs); those specs then skip.
          CLERK_ISSUER: ${{ secrets.CLERK_ISSUER }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
