# Local development services only (PostgreSQL, and Redis for the socket layer, #1). Credentials are local placeholders, not secrets.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: nextnode
      POSTGRES_USER: nextnode
      POSTGRES_PASSWORD: nextnode
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nextnode-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextnode -d nextnode"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nextnode-db:
